<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>La Quête du Shoe Store</title>
<style>
html,body{margin:0;height:100%;background:#14002a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#ffe066;max-width:100%;max-height:100%}
.btn{position:fixed;bottom:18px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);font-size:34px;display:none;align-items:center;justify-content:center;color:#fff}
.btn:active,.btn.on{background:rgba(255,255,255,.5)}
#left{left:16px}#right{left:112px}#jump{right:20px;width:100px;height:100px;bottom:22px}
#emote{right:134px;width:70px;height:70px;bottom:30px;font-size:32px}
@media (pointer:coarse){.btn{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="800" height="450"></canvas></div>
<div class="btn" id="left">◀</div><div class="btn" id="right">▶</div><div class="btn" id="jump">⤒</div><div class="btn" id="emote">😂</div>
<script src="face.js"></script>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
